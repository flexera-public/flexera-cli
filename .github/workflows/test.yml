name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: make build

      - name: go test
        run: make test

      - name: Verify generated completions/docs are up to date
        run: |
          make completions docs
          if ! git diff --quiet -- completions docs; then
            echo "::error::completions/ or docs/ are out of date; run 'make completions docs' and commit the result."
            git diff --stat -- completions docs
            exit 1
          fi

      - name: go vet (integration build tag)
        run: go vet -tags=integration ./...
