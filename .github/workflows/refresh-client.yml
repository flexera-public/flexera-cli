name: refresh-client

# Weekly (or manually-triggered) refresh of the unified-go-client dependency
# and regeneration of the CLI command tree from its latest merged
# unified-openapi spec. Any resulting changes are pushed to a long-lived
# branch and opened/updated as a pull request for manual review, mirroring
# the refresh-client.yml workflow in flexera-public/unified-go-client and
# the refresh-specs.yml workflow in flexera-public/unified-openapi.

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-client
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: flexera-cli

      - uses: actions/setup-go@v5
        with:
          go-version-file: flexera-cli/go.mod
          cache: true
          cache-dependency-path: flexera-cli/go.sum

      - name: Update unified-go-client to latest
        working-directory: flexera-cli
        run: |
          go get github.com/flexera-public/unified-go-client@main
          go mod tidy

      - name: Update pinned unified-openapi snapshot
        working-directory: flexera-cli
        run: make update-unified-openapi

      - name: Regenerate CLI commands from updated spec
        working-directory: flexera-cli
        run: make generate

      - name: Regenerate completions and docs
        working-directory: flexera-cli
        run: make completions docs

      - name: Run tests
        working-directory: flexera-cli
        run: |
          go vet ./...
          make build
          make test

      - name: Check unified-go-client hand-written symbol coverage
        id: client_coverage
        working-directory: flexera-cli
        continue-on-error: true
        run: make check-client-coverage

      - name: Build change summary
        id: summary
        working-directory: flexera-cli
        run: |
          {
            echo "## Automated unified-go-client refresh"
            echo ""
            echo "Generated by the [refresh-client](.github/workflows/refresh-client.yml) workflow."
            echo ""
            if [ "${{ steps.client_coverage.outcome }}" = "failure" ]; then
              echo "> [!WARNING]"
              echo "> \`make check-client-coverage\` found hand-written unified-go-client symbols with no triaged CLI-coverage decision. Add a curated command + allowlist entry, or an \`excluded\` allowlist entry with a reason, in \`internal/coverage/unified_client_allowlist.json\` before merging. Run \`make check-client-coverage\` locally for details."
              echo ""
            fi
            if git diff --quiet; then
              echo "_No changes detected upstream._"
            else
              echo "### Changed files"
              echo ""
              echo '```'
              git diff --stat
              echo '```'
            fi
          } > /tmp/pr-body.md

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: flexera-cli
          commit-message: "chore: refresh unified-go-client dependency and regenerate CLI"
          branch: automated/refresh-client
          delete-branch: false
          title: "chore: automated unified-go-client refresh"
          body-path: /tmp/pr-body.md
          add-paths: |
            go.mod
            go.sum
            unified-openapi
            internal/commands
            completions
            docs
